# INVAR test battery — runs the full offline suite on every push and PR.
# No model or GPU required: tests/fake_llama.py stands in for llama.cpp, so the
# inference / verification / re-execution paths run deterministically in CI.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip cryptography
      - name: Run the full test battery
        run: sh tests/run_all.sh
