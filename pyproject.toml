[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomly-invar"
version = "0.1.14"
description = "INVAR — receipted local AI: every inference carries a re-executable, hash-chained worldline receipt"
readme = { text = "INVAR — receipted local AI by Anomly, Inc. Apache-2.0.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Anomly, Inc." }]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
reexec = ["numpy>=1.24"]

[project.scripts]
invar = "invar.cli:main"

[tool.setuptools]
packages = ["invar"]
