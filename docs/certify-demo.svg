<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="invar certify: a stock GPU server fails L0-L2; the INVAR exact profile passes L0-L5">
<defs><clipPath id="r"><rect width="900" height="560" rx="12"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="900" height="560" fill="#1e2420"/>
<rect width="900" height="28" fill="#2b332d"/><circle cx="16" cy="14" r="5" fill="#e8735a"/><circle cx="34" cy="14" r="5" fill="#e6b450"/><circle cx="52" cy="14" r="5" fill="#9fc26a"/>
<text x="450" y="18" text-anchor="middle" fill="#8f9a86" font-size="12">invar certify — determinism ladder L0–L5</text>
<style>.ln{font-size:14px}</style>
<text class="ln" x="22" y="44" fill="#e8e4d8" opacity="0">$ invar certify --url http://gpu-box:8000/v1 --model qwen3-coder-30b --out ./cert<animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="64" fill="#8f9a86" opacity="0">  workload: 8 requests, 8 concurrent, 3 repeats after priming, greedy, seed 0<animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="84" fill="#e8735a" opacity="0">  L0  run-to-run deterministic     FAIL  3 distinct outputs in 3 repeats, max logprob delta 0.20<animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="104" fill="#e8735a" opacity="0">  L1  batch invariant              FAIL  0/8 requests identical alone vs concurrent<animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="124" fill="#e8735a" opacity="0">  L2  shape invariant              FAIL<animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="144" fill="#8f9a86" opacity="0">  L5  re-executable by a stranger  --    no receipts at this endpoint<animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="164" fill="#e8735a" opacity="0">  Highest rung passed: none<animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="204" fill="#e8e4d8" opacity="0">$ invar certify --url http://localhost:8577/v1 --model smollm2-135m-bposit8 --out ./cert \<animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="224" fill="#e8e4d8" opacity="0">      --compare published-runs/2026-09-12-rtx5090-cuda-smollm2-135m.json --sign software<animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="244" fill="#9fc26a" opacity="0">  L0  run-to-run deterministic     pass  1 distinct output, max logprob delta 0<animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="264" fill="#9fc26a" opacity="0">  L1  batch invariant              pass  8/8 identical<animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="284" fill="#9fc26a" opacity="0">  L2  shape invariant              pass<animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="304" fill="#9fc26a" opacity="0">  L4  identical on another machine pass  vs RTX 5090 CUDA run: 237 positions bit-identical<animate attributeName="opacity" from="0" to="1" begin="6.0s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="324" fill="#9fc26a" opacity="0">  L5  re-executable by a stranger  pass  8/8 receipts fetched, chain ACCEPT, re-executed<animate attributeName="opacity" from="0" to="1" begin="6.5s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="344" fill="#9fc26a" opacity="0">  Highest rung passed: L5  -- certification signed (Ed25519), report.md written<animate attributeName="opacity" from="0" to="1" begin="7.1s" dur="0.25s" fill="freeze"/></text>
<text class="ln" x="22" y="384" fill="#8f9a86" opacity="0">  same GPU, same night, same workload.  measured 2026-09-12  github.com/anomly-labs/invar<animate attributeName="opacity" from="0" to="1" begin="7.8s" dur="0.25s" fill="freeze"/></text>
</g></svg>
