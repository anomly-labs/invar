<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="INVAR terminal demo: install, ask, receipt, verify ACCEPT, tamper REJECT">
  <defs><clipPath id="r"><rect width="900" height="476" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="900" height="476" fill="#0F0C08"/>
    <rect width="900" height="46" fill="#1B1611"/>
    <circle cx="24" cy="23" r="6" fill="#CC5500"/>
    <circle cx="46" cy="23" r="6" fill="#E3B23C"/>
    <circle cx="68" cy="23" r="6" fill="#6B8E23"/>
    <text x="450.0" y="28" text-anchor="middle" fill="#8f9a86" font-size="13" letter-spacing="3">ANOMLY  INVAR</text>
    <style>.ln{font-size:14.5px}</style>
    <text x="26" y="68" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">$ curl -fsSL https://www.anomly.com/get/invar.sh | sh</tspan><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.25s" fill="freeze"/></text><text x="26" y="94" class="ln" fill="#8f9a86" opacity="0"><tspan fill="#8f9a86">INVAR installed.</tspan><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.25s" fill="freeze"/></text><text x="26" y="120" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">$ invar serve --model your-model.gguf &amp;</tspan><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.25s" fill="freeze"/></text><text x="26" y="146" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">$ curl localhost:8577/v1/chat/completions \</tspan><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.25s" fill="freeze"/></text><text x="26" y="172" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">    -d &#x27;{&quot;messages&quot;:[{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;The capital of France is&quot;}]}&#x27;</tspan><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.25s" fill="freeze"/></text><text x="26" y="198" class="ln" fill="#9FD9C2" opacity="0"><tspan fill="#9FD9C2">  &quot;content&quot;: &quot;The capital of France is </tspan><tspan fill="#F5EFE0">Paris</tspan><tspan fill="#9FD9C2">.&quot;,</tspan><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.25s" fill="freeze"/></text><text x="26" y="224" class="ln" fill="#9FD9C2" opacity="0"><tspan fill="#9FD9C2">  &quot;receipt&quot;: {</tspan><animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.25s" fill="freeze"/></text><text x="26" y="250" class="ln" fill="#9FD9C2" opacity="0"><tspan fill="#9FD9C2">    &quot;</tspan><tspan fill="#3F8F8F">certificate</tspan><tspan fill="#9FD9C2">&quot;: &quot;</tspan><tspan fill="#3F8F8F">sha256:87150ce4a6157b54c81a7a…</tspan><tspan fill="#9FD9C2">&quot;,</tspan><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.25s" fill="freeze"/></text><text x="26" y="276" class="ln" fill="#9FD9C2" opacity="0"><tspan fill="#9FD9C2">    &quot;</tspan><tspan fill="#3F8F8F">chain</tspan><tspan fill="#9FD9C2">&quot;:       &quot;</tspan><tspan fill="#3F8F8F">sha256:d4280119e9cc27498603a8…</tspan><tspan fill="#9FD9C2">&quot; }</tspan><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.25s" fill="freeze"/></text><text x="26" y="302" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">$ invar verify worldline.jsonl</tspan><animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.25s" fill="freeze"/></text><text x="26" y="328" class="ln" fill="#8FCf8f" opacity="0"><tspan fill="#8FCf8f">  entry 0: </tspan><tspan fill="#8FCf8f">ACCEPT</tspan><tspan fill="#8FCf8f"> — re-executed, output digest matches</tspan><animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.25s" fill="freeze"/></text><text x="26" y="354" class="ln" fill="#8f9a86" opacity="0"><tspan fill="#8f9a86">  # now edit one byte of the log and check again…</tspan><animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.25s" fill="freeze"/></text><text x="26" y="380" class="ln" fill="#F5EFE0" opacity="0"><tspan fill="#F5EFE0">$ invar verify worldline.jsonl   # tampered</tspan><animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.25s" fill="freeze"/></text><text x="26" y="406" class="ln" fill="#E88b6f" opacity="0"><tspan fill="#E88b6f">  entry 0: </tspan><tspan fill="#E88b6f">REJECT</tspan><tspan fill="#E88b6f"> — </tspan><tspan fill="#3F8F8F">certificate</tspan><tspan fill="#E88b6f"> mismatch</tspan><animate attributeName="opacity" from="0" to="1" begin="6.0s" dur="0.25s" fill="freeze"/></text><text x="26" y="432" class="ln" fill="#8f9a86" opacity="0"><tspan fill="#8f9a86">  Math, not trust.</tspan><animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.25s" fill="freeze"/></text>
  </g>
  <rect width="900" height="476" rx="12" fill="none" stroke="#232B33" stroke-width="1"/>
</svg>